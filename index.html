<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Stanley Coute, alias Phước Lan, développeur web full-stack en formation : parcours, projets et contact."
    />
    <meta name="theme-color" content="#B3261E" />
    <title>Stanley Coute (Phước Lan) · Développeur web full-stack</title>
    <!--
      Applique le thème AVANT le premier affichage.
      Sans ce script, React démarre après le premier rendu du navigateur :
      un visiteur en thème sombre verrait un éclair de fond clair.
    -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
