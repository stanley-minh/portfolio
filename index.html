<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Stanley Coute, alias Phước Lan, développeur web full-stack en formation, en recherche d'alternance DWWM à Toulouse : parcours, projets et contact."
    />
    <meta name="theme-color" content="#B3261E" />
    <title>Stanley Coute (Phước Lan) · Développeur web full-stack</title>
    <link rel="canonical" href="https://stanley-minh.github.io/portfolio/" />

    <!--
      Aperçu social (Open Graph) : ce que LinkedIn, Slack, Discord… affichent quand on partage le lien.
      Les URL doivent être ABSOLUES : le robot qui lit cette page ne connaît pas l'adresse du site.
      Image : public/og-image.png (1200×630), exportée depuis .github/assets/og-image.svg.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Stanley Coute · Portfolio" />
    <meta property="og:url" content="https://stanley-minh.github.io/portfolio/" />
    <meta property="og:title" content="Stanley Coute (Phước Lan) · Développeur web full-stack" />
    <meta
      property="og:description"
      content="Développeur web full-stack en formation : parcours, projets et contact. En recherche d'alternance."
    />
    <meta property="og:image" content="https://stanley-minh.github.io/portfolio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Stanley Coute, alias Phước Lan, développeur web full-stack en formation. Bannière rouge et or avec un dragon couvert de lotus." />
    <!-- X (Twitter) lit les balises og:*, mais il lui faut ce réglage pour afficher la grande image. -->
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Applique le thème AVANT le premier affichage.
      Sans ce script, React démarre après le premier rendu du navigateur :
      un visiteur en thème sombre verrait un éclair de fond clair.
    -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <!--
      Sans JavaScript (bloqué, ou outil qui lit la page sans l'exécuter), React n'affiche rien :
      ce bloc donne l'essentiel. Les infos d'alternance doublent ALTERNANCE (src/data/site.ts).
      Le CSS du site est chargé par une balise <link>, il s'applique donc aussi ici.
    -->
    <noscript>
      <main class="wrap" style="padding-block: 48px">
        <h1>Stanley Coute (Phước Lan)</h1>
        <p>Développeur web full-stack en formation.</p>
        <p>
          <strong>Je cherche une alternance DWWM</strong> à Toulouse, dès maintenant, au rythme de 4 jours en
          entreprise et 1 jour en formation.
        </p>
        <ul>
          <li><a href="mailto:stanleybullet.pro@gmail.com">stanleybullet.pro@gmail.com</a></li>
          <li><a href="%BASE_URL%cv.pdf">Télécharger le CV (PDF)</a></li>
          <li><a href="https://github.com/stanley-minh">GitHub</a> · <a href="https://www.linkedin.com/in/stancte">LinkedIn</a></li>
        </ul>
        <p>Activez JavaScript pour voir le site complet&nbsp;: parcours, projets et étude de cas.</p>
      </main>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
